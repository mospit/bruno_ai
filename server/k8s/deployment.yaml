apiVersion: apps/v1
kind: Deployment
metadata:
  name: bruno-ai-backend
  namespace: default
  labels:
    app: bruno-ai
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bruno-ai
      component: backend
  template:
    metadata:
      labels:
        app: bruno-ai
        component: backend
    spec:
      containers:
      - name: bruno-ai-backend
        image: bruno-ai:latest
        ports:
        - containerPort: 8000
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: bruno-ai-secrets
              key: anthropic-api-key
        - name: INSTACART_API_KEY
          valueFrom:
            secretKeyRef:
              name: bruno-ai-secrets
              key: instacart-api-key
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: bruno-ai-secrets
              key: postgres-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bruno-ai-secrets
              key: jwt-secret
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8000"
        - name: MAX_TOKENS_PER_REQUEST
          value: "8000"
        - name: ENABLE_CACHING
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: bruno-ai-backend-service
  labels:
    app: bruno-ai
    component: backend
spec:
  selector:
    app: bruno-ai
    component: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bruno-ai-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bruno-ai-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
