# Fly.io Staging Configuration for Bruno AI Backend

app = 'bruno-ai-staging'
primary_region = 'sjc'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  dockerfile = './backend/Dockerfile'

[env]
  NODE_ENV = 'staging'
  API_PORT = '8080'

[experimental]
  auto_rollback = true

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 250

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'
    restart_limit = 0

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    restart_limit = 0
    method = 'get'
    path = '/health'
    protocol = 'http'
    tls_skip_verify = false

[metrics]
  port = 9091
  path = '/metrics'

[[statics]]
  guest_path = '/app/public'
  url_prefix = '/static/'
